<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - Script Order Automation</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #e0f7fa, #fff);
      text-align: center;
      padding: 40px;
    }
    .container {
      background: #fff;
      padding: 30px;
      max-width: 400px;
      margin: auto;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }
    h1 {
      color: #007BFF;
    }
    .btn {
      background: #007BFF;
      color: #fff;
      padding: 12px 25px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
    }
    #qrcode {
      margin-top: 20px;
    }
    .note {
      font-size: 12px;
      color: #555;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Script Order Automation</h1>
  <p>Total: <strong>Rp 5.000</strong></p>
  <button class="btn" onclick="generateQR()">Bayar via QRIS</button>
  
  <div id="qrcode"></div>
  <p class="note" id="note"></p>
</div>

<script>
async function generateQR() {
  const apikey = "145461917383966842162877OKCTA93AACD2638878D4A395F7E91C2C7040";
  const amount = 5000;
  const codeqr = encodeURIComponent("00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214510458376546110303UMI51440014ID.CO.QRIS.WWW0215ID20253689646510303UMI5204541153033605802ID5920GENEXSTORE OK21628776015PESISIR SELATAN61052565162070703A016304DB37");

  const url = `https://api.simplebot.my.id/orderkuota/createpayment?apikey=${apikey}&amount=${amount}&codeqr=${codeqr}`;

  const res = await fetch(url);
  const data = await res.json();

  if (data.status) {
    document.getElementById("qrcode").innerHTML = `<img src="${data.qr_link}" alt="QRIS QR" width="300">`;
    document.getElementById("note").innerText = "Scan QR di atas menggunakan aplikasi e-wallet kamu.";
  } else {
    document.getElementById("qrcode").innerHTML = "";
    document.getElementById("note").innerText = "Gagal generate QR: " + data.error;
  }
}
</script>

</body>
</html>
