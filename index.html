<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Script Order Automation</title>
  <style>
    body {
      background: linear-gradient(to right, #0ff0b3, #036ed9);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      padding: 50px;
    }
    .box {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 15px;
      max-width: 400px;
      margin: auto;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }
    button {
      padding: 10px 20px;
      background: #00ffcc;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #00e6b8;
    }
    img {
      margin-top: 20px;
      width: 220px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Script Order Automation</h1>
    <p>Harga: Rp 15.000</p>
    <button onclick="buatPembayaran()">Beli Sekarang</button>
    <div id="qris-area"></div>
  </div>

  <script>
    async function buatPembayaran() {
      document.getElementById("qris-area").innerHTML = "Generating QR...";
      const url = `https://api.simplebot.my.id/orderkuota/createpayment?apikey=145461917383966842162877OKCTA93AACD2638878D4A395F7E91C2C7040&amount=15000&codeqr=00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214510458376546110303UMI51440014ID.CO.QRIS.WWW0215ID20253689646510303UMI5204541153033605802ID5920GENEXSTORE+OK21628776015PESISIR+SELATAN61052565162070703A016304DB37`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.status) {
        const invoice = data.data.invoice_id;
        document.getElementById("qris-area").innerHTML = `
          <img src="${data.data.qr_image}" alt="QRIS">
          <p>Scan QRIS untuk membayar</p>
        `;
        cekStatus(invoice);
      } else {
        document.getElementById("qris-area").innerHTML = "Gagal generate QR: " + data.error;
      }
    }

    async function cekStatus(invoiceId) {
      const url = `https://api.simplebot.my.id/orderkuota/cekstatus?apikey=145461917383966842162877OKCTA93AACD2638878D4A395F7E91C2C7040&merchant=OK2162877&keyorkut=020609&invoice_id=${invoiceId}`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.status) {
        document.getElementById("qris-area").innerHTML = "<b>Pembayaran berhasil!</b><br>Produk akan segera dikirim.";
        // Di sini bisa trigger kirim email, kirim WA, atau tampilkan link download
      } else {
        setTimeout(() => cekStatus(invoiceId), 7000); // cek ulang setiap 7 detik
      }
    }
  </script>
</body>
</html>
